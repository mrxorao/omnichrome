[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 %(ENV_RESOLUTION_WIDTH)sx%(ENV_RESOLUTION_HEIGHT)sx24 -ac +extension GLX +render -noreset
priority=1
autorestart=true
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err

[program:openbox]
command=openbox
environment=DISPLAY=":99"
priority=2
autorestart=true
stdout_logfile=/var/log/supervisor/openbox.log
stderr_logfile=/var/log/supervisor/openbox.err

[program:x11vnc]
command=/launch-x11vnc.sh
priority=3
autorestart=true
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.err

[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5900
priority=4
autorestart=true
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.err

[program:chrome]
command=/launch-chrome.sh
environment=DISPLAY=":99"
priority=5
autorestart=true
stdout_logfile=/var/log/supervisor/chrome.log
stderr_logfile=/var/log/supervisor/chrome.err

[program:keep_maximized]
command=/keep-maximized.sh
environment=DISPLAY=":99"
priority=6
autorestart=true
stdout_logfile=/var/log/supervisor/keep_maximized.log
stderr_logfile=/var/log/supervisor/keep_maximized.err

[program:socat]
command=socat TCP-LISTEN:9222,fork,reuseaddr TCP:127.0.0.1:9223
priority=7
autorestart=true
stdout_logfile=/var/log/supervisor/socat.log
stderr_logfile=/var/log/supervisor/socat.err
