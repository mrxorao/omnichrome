services:
  omnichrome:
    image: xorao/omnichrome:latest
    container_name: omnichrome
    restart: unless-stopped
    ports:
      - "${PORT_NOVNC:-6080}:6080" # noVNC Web UI (http://localhost:6080)
      - "${PORT_VNC:-5900}:5900"   # Direct VNC (localhost:5900)
      - "${PORT_CDP:-9222}:9222"   # CDP Remote Debugging (http://localhost:9222)
    environment:
      - DISPLAY=:99
      - RESOLUTION_WIDTH=${RESOLUTION_WIDTH:-1366}
      - RESOLUTION_HEIGHT=${RESOLUTION_HEIGHT:-768}
      - TZ=${TZ:-UTC}
      - SEARCH_ENGINE=${SEARCH_ENGINE:-google} # google, duckduckgo, bing
      - HOMEPAGE_URL=${HOMEPAGE_URL:-} # Optional custom homepage
      - AUTO_UPDATE=${AUTO_UPDATE:-true}
      - PROXY_SERVER=${PROXY_SERVER:-}
      - VNC_PASSWORD=${VNC_PASSWORD:-}
    volumes:
      - ./data/default:/data/profile
    shm_size: "2gb"
